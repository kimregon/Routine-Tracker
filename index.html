<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Schedule Tracker</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #27ae60;
            --text: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 20px;
        }

        .time-block {
            border-bottom: 1px solid #eef2f5;
            padding: 12px 0;
        }

        .time-header {
            font-size: 0.85rem;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 4px;
        }

        .activity-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .activity-desc {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .day-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            color: #555;
        }

        .day-box input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-top: 3px;
            accent-color: var(--accent);
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .save-btn {
            background-color: var(--accent);
            color: white;
        }

        .reset-btn {
            background-color: #e74c3c;
            color: white;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Master Schedule Tracker</h1>
    <div class="subtitle">GATE | UGC-NET | Technical Skills</div>

    <form id="trackerForm">
        <!-- Time Blocks -->
        <div id="scheduleContainer"></div>

        <div class="controls">
            <button type="button" class="save-btn" onclick="saveProgress()">Save Progress</button>
            <button type="button" class="reset-btn" onclick="resetWeekly()">Reset Week</button>
        </div>
    </form>
</div>

<script>
    const scheduleData = [
        { time: "08:30 AM – 08:45 AM", title: "Wake Up & Hydrate", desc: "Morning refresh & water" },
        { time: "08:45 AM – 09:30 AM", title: "Exercise & Fitness", desc: "Workout / Yoga / Running" },
        { time: "09:30 AM – 10:15 AM", title: "Freshen Up & Breakfast", desc: "Shower & healthy meal" },
        { time: "10:15 AM – 11:45 AM", title: "Focus Block 1: Stats & Aptitude", desc: "Phase 1: Stats & Numericals | Phase 2: NET Paper 1" },
        { time: "11:45 AM – 01:45 PM", title: "Focus Block 2: Heavy Core Psych", desc: "Bio, Cognitive, Psychometrics | Phase 2: NET Units 1 & 10" },
        { time: "01:45 PM – 02:45 PM", title: "Lunch & Power Nap", desc: "Relaxed meal + 20-min nap" },
        { time: "02:45 PM – 02:55 PM", title: "Commute to Class", desc: "10-minute travel" },
        { time: "03:00 PM – 05:00 PM", title: "Computer Class", desc: "Active class & lab work" },
        { time: "05:00 PM – 05:45 PM", title: "Commute & Immediate Coding Lab", desc: "10-min travel + 35-min instant coding practice" },
        { time: "05:45 PM – 06:00 PM", title: "Evening Tea Refresh", desc: "Unwind & light snack" },
        { time: "06:00 PM – 08:00 PM", title: "Focus Block 3: Secondary Core", desc: "Phase 1: GATE OB & Applied Psych | Phase 2: Paper 1 & PYQs" },
        { time: "08:00 PM – 09:00 PM", title: "Dinner & Disconnect", desc: "Screen-free personal time" },
        { time: "09:00 PM – 10:00 PM", title: "Targeted Skill Slot", desc: "M/W: Class Coding | T/Th: Excel & HR | Fri: UI/UX | Sat: English" },
        { time: "10:00 PM – 11:30 PM", title: "Free Reading / Courses", desc: "Light study, hobbies, or personal courses" },
        { time: "11:30 PM – 01:30 AM", title: "Wind Down", desc: "Personal time & call" },
        { time: "01:30 AM – 08:30 AM", title: "Sleep", desc: "7 full hours of rest" }
    ];

    const days = ["M", "T", "W", "T", "F", "S", "S"];

    function renderSchedule() {
        const container = document.getElementById("scheduleContainer");
        container.innerHTML = "";

        scheduleData.forEach((item, index) => {
            const block = document.createElement("div");
            block.className = "time-block";

            let daysHTML = "";
            days.forEach((day, dayIdx) => {
                const id = `cb_${index}_${dayIdx}`;
                daysHTML += `
                    <div class="day-box">
                        <span>${day}</span>
                        <input type="checkbox" id="${id}" id="chk_${index}_${dayIdx}">
                    </div>
                `;
            });

            block.innerHTML = `
                <div class="time-header">${item.time}</div>
                <div class="activity-title">${item.title}</div>
                <div class="activity-desc">${item.desc}</div>
                <div class="days-grid">${daysHTML}</div>
            `;
            container.appendChild(block);
        });

        loadProgress();
    }

    function saveProgress() {
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        const state = {};
        checkboxes.forEach(cb => {
            state[cb.id] = cb.checked;
        });
        localStorage.setItem("routineProgress", JSON.stringify(state));
        alert("Progress saved locally!");
    }

    function loadProgress() {
        const saved = localStorage.getItem("routineProgress");
        if (saved) {
            const state = JSON.parse(saved);
            Object.keys(state).forEach(id => {
                const cb = document.getElementById(id);
                if (cb) cb.checked = state[id];
            });
        }
    }

    function resetWeekly() {
        if (confirm("Are you sure you want to reset all check boxes for a new week?")) {
            localStorage.removeItem("routineProgress");
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        }
    }

    window.onload = renderSchedule;
</script>

</body>
</html>
